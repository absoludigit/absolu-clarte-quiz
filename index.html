  <style>

    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;600;700;800&display=swap');
    :root{--navy:#101D3A;--ink:#18233D;--paper:#F6F3ED;--cyan:#77E6E2;--coral:#FF6B72;--coral-text:#D9454F;--orange:#FFB45B;--muted:#717989}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Manrope,Arial,sans-serif}.shell{min-height:100vh;padding:28px 5vw 24px;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:inline-flex;align-items:center;gap:11px;color:var(--navy);font-size:15px;font-weight:600}.mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}.mark img,.circle img{display:block;width:100%;height:100%;object-fit:contain}.word{border-bottom:1px solid var(--navy);padding-bottom:2px;letter-spacing:-.04em}.word strong{font-weight:800}.word i{border:0;color:var(--coral);font-family:Georgia,serif;font-style:normal;margin-left:4px}.topnote,.micro,.foot{color:#777e8b;font-size:11px;letter-spacing:.07em;text-transform:uppercase}.foot a{color:inherit;text-decoration:none}.foot a:hover{text-decoration:underline}.landing{flex:1;max-width:1250px;width:100%;margin:auto;display:grid;grid-template-columns:1.05fr .95fr;gap:4vw;align-items:center;padding:7vh 0 6vh}.copy{max-width:650px}.eyebrow{display:flex;align-items:center;gap:10px;color:#626878;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin:0 0 25px}.eyebrow:before{content:'';width:34px;height:1px;background:var(--coral)}h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;letter-spacing:-.035em;color:var(--navy)}.copy h1{font-size:clamp(54px,7.5vw,110px);line-height:.92;margin:0}.copy h1 em{color:var(--coral);font-style:italic}.lead{max-width:480px;color:#575f70;font-size:clamp(16px,1.7vw,20px);line-height:1.6;margin:32px 0}.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 20px;border:1px solid var(--navy);background:transparent;color:var(--navy);font:800 13px Manrope;cursor:pointer;transition:.18s ease;text-decoration:none}.btn:hover{background:#eaf8f5;border-color:#4fafad;transform:translateY(-2px)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.micro{margin-top:16px;text-transform:none;letter-spacing:.02em;color:#858996}.art{min-height:450px;position:relative;display:grid;place-items:center}.ring{position:absolute;border:1px solid rgba(16,29,58,.22);border-radius:50%}.r1{width:min(36vw,480px);height:min(36vw,480px);border-style:dashed}.r2{width:min(27vw,360px);height:min(27vw,360px);border-color:var(--cyan);transform:translate(22px,-16px)}.sun{width:min(15vw,185px);height:min(15vw,185px);border-radius:50%;background:var(--orange);transform:translate(-30px,15px)}.needle{position:absolute;width:170px;height:170px;transform:rotate(35deg)}.needle:before{content:'';display:block;width:1px;height:150px;background:var(--navy);margin:10px auto}.needle:after{content:'';position:absolute;top:0;left:50%;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:21px solid var(--coral);transform:translateX(-50%)}.caption{position:absolute;right:6%;bottom:7%;display:flex;flex-direction:column;gap:5px;font-size:10px;letter-spacing:.13em;text-transform:uppercase}.caption b{color:#4fafad}.foot{display:flex;justify-content:space-between;border-top:1px solid rgba(16,29,58,.13);padding-top:22px}.quiz{background:#fffdf8}.progress{height:3px;background:rgba(16,29,58,.12);margin-top:30px;position:relative}.progress i{height:100%;display:block;background:var(--cyan);transition:width .24s ease}.layout{flex:1;max-width:1180px;width:100%;margin:auto;display:grid;grid-template-columns:.32fr 1fr;gap:9vw;align-items:center;padding:7vh 0 5vh}.aside{align-self:stretch;display:flex;flex-direction:column;padding:24px 0;border-right:1px solid rgba(16,29,58,.14)}.circle{width:64px;height:64px;border:1px solid var(--cyan);border-radius:50%;display:grid;place-items:center;font-size:29px;margin-bottom:38px}.aside h2{font:400 28px 'DM Serif Display',Georgia,serif;margin:0 0 14px}.aside p{max-width:190px;color:#757b88;font-size:14px;line-height:1.7;margin:0}.aside small{margin-top:auto;color:#777e8b;text-transform:uppercase;font-size:10px;letter-spacing:.14em}.question{max-width:750px}.question h1{font-size:clamp(38px,5vw,68px);line-height:1.01;margin:0 0 18px}.hint{color:var(--coral-text);font-size:14px;font-weight:600;line-height:1.6;margin:0 0 34px}.choices{display:grid;gap:11px}.choice{width:100%;display:flex;align-items:center;gap:15px;padding:17px 18px;text-align:left;border:1px solid rgba(16,29,58,.18);background:transparent;color:var(--ink);cursor:pointer}.choice:hover,.choice.selected{border-color:var(--navy);background:#f2f8f6}.key{width:28px;height:28px;border:1px solid var(--coral);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:0 0 auto}.choice span:nth-child(2){display:flex;flex-direction:column;gap:4px}.choice strong{font-size:14px}.choice small{color:#858b96;font-size:12px}.check{margin-left:auto;color:#4fafad;opacity:0}.selected .check{opacity:1}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px}.back{border:0;background:transparent;color:#747b89;cursor:pointer}.back:disabled{opacity:.3;cursor:not-allowed}.result{background:var(--navy);color:var(--paper)}.result .brand,.result h1{color:var(--paper)}.result .mark{border-color:var(--paper)}.result .word{border-color:var(--paper)}.result .topnote{color:#c0c8d5}.result .layout{grid-template-columns:1.05fr .95fr}.result h1{font-size:clamp(46px,6vw,86px);line-height:.98;margin:0 0 24px}.result .eyebrow{color:var(--cyan);font-weight:800}.result .eyebrow:before{background:var(--cyan)}.resultcopy{max-width:620px;color:#c0c8d5;font-size:17px;line-height:1.7}.next{margin-top:36px;padding:20px 22px;border-left:2px solid var(--cyan);background:rgba(255,255,255,.06)}.next b{color:var(--cyan);font-size:10px;letter-spacing:.15em;text-transform:uppercase}.next p{color:#e8edf3;font-size:14px;line-height:1.6;margin:10px 0 0}.result .btn{color:var(--cyan);border-color:var(--cyan)}.result .btn:hover{background:rgba(119,230,226,.12)}.result .foot{color:#a8b4c6;border-color:rgba(246,243,237,.2)}.result-actions{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:28px;row-gap:12px}.secondary-link{color:#d7dde8;font:700 13px Manrope;text-decoration:underline;text-underline-offset:3px}.secondary-link:hover{color:var(--cyan)}.hidden{display:none!important}
    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px;max-width:420px}.field label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#626878}.field input[type=text],.field input[type=email]{padding:15px 16px;border:1px solid rgba(16,29,58,.25);background:#fff;font:600 15px Manrope;color:var(--ink)}.field input:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:var(--navy)}.field input::placeholder{color:#a6acb8;font-weight:500}.consent{display:flex;gap:10px;align-items:flex-start;max-width:460px;font-size:12px;color:#666d7a;line-height:1.55;margin:6px 0 26px}.consent input{margin-top:3px;accent-color:var(--navy)}.consent a{color:var(--navy)}.errormsg{color:var(--coral-text);font-size:12px;font-weight:700;margin-top:2px;min-height:16px}
    @media(max-width:820px){.shell{padding:20px 22px}.topnote{display:none}.landing,.layout,.result .layout{grid-template-columns:1fr;gap:28px;padding-top:6vh}.art{min-height:270px;order:-1}.r1{width:270px;height:270px}.r2{width:205px;height:205px}.sun{width:112px;height:112px}.needle{transform:scale(.72) rotate(35deg)}.caption{right:15%;bottom:0}.aside{border-right:0;border-bottom:1px solid rgba(16,29,58,.14);padding:0 0 22px;flex-direction:row;align-items:center;gap:16px}.circle{width:48px;height:48px;margin:0;flex:0 0 auto}.aside h2{font-size:21px;margin:0}.aside p,.aside small{display:none}.question h1{font-size:clamp(40px,10vw,62px)}.result .layout{padding-top:6vh}.foot{gap:20px}.foot span:last-child{text-align:right}}

function validateEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}

async function postToBrevo(fields){
  if(BREVO_CONFIG.formAction.indexOf('REMPLACER_PAR_URL_ACTION_BREVO')!==-1){
    console.warn('[Absolu Clarté] Brevo non configuré : voir BREVO_CONFIG en haut du script.');
    return;
  }
  const params = new URLSearchParams();
  Object.entries(fields).forEach(([k,v])=>{ if(v) params.append(k,v); });
  Object.entries(BREVO_CONFIG.hiddenFields).forEach(([k,v])=>params.append(k,v));
  console.log('[Absolu Clarté] Envoi vers Brevo :', BREVO_CONFIG.formAction, Object.fromEntries(params));
  try{
    await fetch(BREVO_CONFIG.formAction, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: params.toString()
    });
    console.log('[Absolu Clarté] Requête envoyée à Brevo (réponse non lisible en no-cors, c\'est normal).');
  }catch(e){
    console.warn('[Absolu Clarté] Envoi Brevo impossible (le quiz continue quand même).', e);
  }
}

function landing(){
  app.className='shell landing';
  content.innerHTML='<section class="landing"><div class="copy"><p class="eyebrow">Un espace de réflexion guidée</p><h1>Et si votre<br><em>Pourquoi</em> était<br>déjà là ?</h1><p class="lead">Vous avez une activité, des idées et une histoire. Ce quiz vous aide à repérer ce qui les relie, sans vous demander d’avoir la bonne réponse tout de suite.</p><button class="btn" id="start">Observons ensemble →</button><p class="micro">8 questions · environ 3 minutes · aucun jugement</p></div><div class="art"><div class="ring r1"></div><div class="ring r2"></div><div class="sun"></div><div class="needle"></div><div class="caption"><b>POINT DE DÉPART</b><span>commencer par soi</span></div></div></section>';
  document.getElementById('start').onclick=()=>{emailGate()};
}

let gateRenderedAt = null;

function emailGate(){
  app.className='shell quiz';
  gateRenderedAt = Date.now();
  content.innerHTML=`<div class="progress"><i style="width:4%"></i></div><section class="layout"><aside class="aside"><div class="circle">✉</div><div><h2>Votre résultat, par email</h2><p>Votre profil et un premier pas concret arrivent directement dans votre boîte mail.</p></div><small>Avant de commencer</small></aside><div class="question"><p class="eyebrow">Une dernière chose</p><h1>Où faut-il vous envoyer votre clarté ?</h1><p class="hint">Aucun spam. Vous pouvez vous désinscrire en un clic à tout moment.</p><form id="gate-form" novalidate><div class="field"><label for="fn">Prénom</label><input id="fn" name="fn" type="text" autocomplete="given-name" placeholder="Votre prénom"></div><div class="field"><label for="em">Email</label><input id="em" name="em" type="email" autocomplete="email" required placeholder="vous@exemple.com"></div><label class="consent"><input type="checkbox" id="consent" required><span>J’accepte de recevoir mon résultat et des messages d’Absolu Clarté par email. Désinscription possible à tout moment. <a href="${PRIVACY_URL}" target="_blank" rel="noopener">Politique de confidentialité</a>.</span></label><p class="errormsg" id="gate-error"></p><div class="actions"><button type="button" class="back" id="gate-back">← Retour</button><button class="btn" type="submit" id="gate-submit">Observons ensemble →</button></div></form></div></section>`;
  document.getElementById('gate-back').onclick=()=>landing();
  document.getElementById('gate-form').onsubmit=async (e)=>{
    e.preventDefault();
    const email=document.getElementById('em').value.trim();
    const fn=document.getElementById('fn').value.trim();
    const consent=document.getElementById('consent').checked;
    const errEl=document.getElementById('gate-error');
    errEl.textContent='';
    if(!validateEmail(email)){errEl.textContent='Merci de vérifier votre adresse email.';return;}
    if(!consent){errEl.textContent='Merci de cocher la case pour continuer.';return;}
    const btn=document.getElementById('gate-submit');
    btn.disabled=true;btn.textContent='Envoi en cours…';
    state.email=email;state.firstName=fn;
    const elapsed = Date.now() - gateRenderedAt;
    if(elapsed < 1200){
      console.warn('[Absolu Clarté] Soumission anormalement rapide ('+elapsed+'ms), envoi Brevo ignoré par précaution.');
    } else {
      await postToBrevo({ [BREVO_CONFIG.emailField]: email, [BREVO_CONFIG.firstNameField]: fn });
    }
    state.started=true;
    quiz();
  };
}

function result(){
  const counts=[0,0,0,0];
  state.answers.forEach(a=>counts[a]++);
  const type=counts.indexOf(Math.max(...counts));
  const p=PROFILES[type];
  const letter=String.fromCharCode(65+type);
  const workbookLink=`${WORKBOOK_URL}?utm_source=quiz&utm_medium=lead-magnet&utm_campaign=pourquoi&profil=${p.slug}`;
  app.className='shell result';
  if(state.email){
    postToBrevo({ [BREVO_CONFIG.emailField]: state.email, [BREVO_CONFIG.profileField]: p.name });
  }
  const actions = type===3
